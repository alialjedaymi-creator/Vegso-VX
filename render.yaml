services:
  - type: web
    name: pharma-system-cosanostra
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /opt/render/project/src/server/data/data.db
    disk:
      name: pharma-data-disk
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1

