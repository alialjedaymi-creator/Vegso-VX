<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cosagrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background transparent circles/grids -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#cosagrad)" stroke-width="1" stroke-dasharray="4,4" opacity="0.3" />
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#cosagrad)" stroke-width="1.5" opacity="0.4" />
  <circle cx="100" cy="100" r="55" fill="none" stroke="url(#cosagrad)" stroke-width="0.5" stroke-dasharray="2,6" opacity="0.5" />
  
  <!-- Orbiting dots representing technology/data -->
  <circle cx="100" cy="15" r="3" fill="#00E5FF" />
  <circle cx="30" cy="100" r="2.5" fill="#7C4DFF" />
  <circle cx="170" cy="100" r="2" fill="#00B0FF" />
  
  <!-- Futuristic Medical Cross with stylized interior -->
  <path d="M 85,45 L 115,45 L 115,75 L 145,75 L 145,105 L 115,105 L 115,135 L 85,135 L 85,105 L 55,105 L 55,75 L 85,75 Z" 
        fill="none" stroke="url(#cosagrad)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Digital Pulse Line passing through the cross -->
  <path d="M 60,90 L 80,90 L 87,70 L 95,120 L 103,60 L 110,105 L 115,90 L 140,90" 
        fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
